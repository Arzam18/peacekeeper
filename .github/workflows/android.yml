name: Build Peacekeeper for Android ARM64 NEON

on:
  workflow_dispatch:
    inputs:
      uci_date:
        description: "Peacekeeper UCI version/date (YYYYMMDD)"
        required: true
        default: "20261109"
        type: string

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose Peacekeeper NNUE source
        shell: bash
        run: bash scripts/diagnose-network.sh

      - name: Install Android NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          NDK_ARCHIVE="$RUNNER_TEMP/android-ndk-r27c-linux.zip"
          NDK_ROOT="$RUNNER_TEMP/android-ndk-r27c"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip \
            --output "$NDK_ARCHIVE"
          mkdir -p "$NDK_ROOT"
          unzip -q "$NDK_ARCHIVE" -d "$NDK_ROOT"
          echo "ANDROID_NDK_HOME=$NDK_ROOT/android-ndk-r27c" >> "$GITHUB_ENV"
          test -x "$NDK_ROOT/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"

      - name: Build and verify Peacekeeper
        shell: bash
        env:
          UCI_DATE: ${{ inputs.uci_date }}
        run: bash scripts/build-android.sh

      # Keep the downloadable engine artifact engine-only: exactly one binary.
      - name: Upload Android ARM64 NEON executable
        uses: actions/upload-artifact@v4
        with:
          name: peacekeeper-android-arm64-neon-${{ inputs.uci_date }}
          path: build/peacekeeper-android-arm64-neon
          if-no-files-found: error
          retention-days: 30

      - name: Upload network diagnostics (also when build fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peacekeeper-network-diagnostics-${{ inputs.uci_date }}
          path: dist/network-diagnostics.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: peacekeeper-arm64-neon-verification-${{ inputs.uci_date }}
          path: |
            dist/peacekeeper-android-arm64-neon.sha256
            dist/nnue-neon-disassembly.txt
            dist/elf-header.txt
            dist/default.nn.sha256
            dist/compiler-version.txt
            dist/build-metadata.txt
          if-no-files-found: error
          retention-days: 30
