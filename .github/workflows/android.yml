name: Build Peacekeeper for Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "Makefile"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-24 build-tools;35.0.0 ndk;27.2.12479018"

      - name: Build ARM64 NEON
        shell: bash
        run: |
          set -euxo pipefail

          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"

          test -f src/default.nn

          mkdir -p build

          "$CXX" \
            src/*.cpp \
            -std=c++17 \
            -O3 \
            -ffast-math \
            -DNDEBUG \
            -pthread \
            -march=armv8-a+simd \
            -fPIE \
            -pie \
            -DVERSION=-1 \
            '-DNETWORK_FILE="src/default.nn"' \
            -o build/peacekeeper-android-arm64

          file build/peacekeeper-android-arm64
          readelf -h build/peacekeeper-android-arm64 | grep -E 'Class|Machine'
          ls -lh build/peacekeeper-android-arm64

      - name: Smoke test with QEMU
        shell: bash
        run: |
          set -euxo pipefail

          # The Android executable is dynamically linked against Android's
          # bionic/libc++. It cannot be executed directly on the Ubuntu runner.
          # Check the ELF and required dynamic loader instead of falsely
          # declaring a QEMU/Linux execution test valid.
          readelf -l build/peacekeeper-android-arm64 | grep 'Requesting program interpreter' || true

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          cd build
          zip -9 peacekeeper-android-arm64.zip peacekeeper-android-arm64
          sha256sum peacekeeper-android-arm64 peacekeeper-android-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: peacekeeper-android-arm64-neon
          path: build/peacekeeper-android-arm64.zip
          if-no-files-found: error
